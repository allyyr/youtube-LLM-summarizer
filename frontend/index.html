<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gist — YouTube video summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14130F;
    --panel: #1C1B16;
    --panel-raised: #22201A;
    --border: rgba(244, 241, 234, 0.09);
    --text: #F2EFE6;
    --text-secondary: #9B968A;
    --text-muted: #6E6A5F;
    --gold: #D9A441;
    --gold-dim: rgba(217, 164, 65, 0.14);
    --error: #D9724C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 24px 96px;
  }

  .reel {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
  }

  .reel span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.15;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--text-secondary);
    font-size: 16px;
    margin: 0 0 48px;
    max-width: 46ch;
  }

  .field {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
    transition: border-color 0.15s ease;
  }

  .field:focus-within {
    border-color: var(--gold);
  }

  .field input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 16px 18px;
  }

  .field input::placeholder {
    color: var(--text-muted);
  }

  .field button {
    border: none;
    background: var(--gold);
    color: #221A08;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 0 24px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .field button:hover { filter: brightness(1.08); }
  .field button:disabled { opacity: 0.5; cursor: not-allowed; }

  .styles {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .style-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .style-btn:hover { border-color: var(--text-muted); color: var(--text); }

  .style-btn.active {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--gold);
  }

  .status {
    margin-top: 28px;
    color: var(--text-secondary);
    font-size: 14px;
    display: none;
    align-items: center;
    gap: 10px;
  }

  .status.visible { display: flex; }

  .status .reel span { animation: pulse 1.1s ease-in-out infinite; }
  .status .reel span:nth-child(2) { animation-delay: 0.15s; }
  .status .reel span:nth-child(3) { animation-delay: 0.3s; }
  .status .reel { margin: 0; }

  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; background: var(--gold); }
  }

  .error {
    margin-top: 28px;
    padding: 14px 16px;
    border: 1px solid rgba(217, 114, 76, 0.35);
    background: rgba(217, 114, 76, 0.08);
    border-radius: 8px;
    color: var(--error);
    font-size: 14px;
    display: none;
  }

  .error.visible { display: block; }

  .result {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
    display: none;
  }

  .result.visible { display: block; }

  .result-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .result-meta .label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: none;
  }

  .cached-tag {
    font-size: 12px;
    color: var(--gold);
    background: var(--gold-dim);
    padding: 3px 9px;
    border-radius: 5px;
  }

  .summary {
    font-size: 15px;
    color: var(--text);
    white-space: pre-wrap;
  }

  .summary strong { color: var(--gold); font-weight: 600; }

  @media (max-width: 480px) {
    .wrap { padding: 48px 20px 72px; }
    h1 { font-size: 32px; }
    .field { flex-direction: column; }
    .field button { padding: 14px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="reel"><span></span><span></span><span></span><span></span><span></span></div>

    <h1>Paste a link, get the gist.</h1>
    <p class="sub">Drop in a YouTube URL. Gist pulls the transcript and hands you back the parts worth knowing.</p>

    <div class="field">
      <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      <button id="submit-btn">Summarize</button>
    </div>

    <div class="styles">
      <button class="style-btn active" data-style="tldr_bullets">TL;DR</button>
      <button class="style-btn" data-style="chapters">Chapters</button>
      <button class="style-btn" data-style="study_notes">Study notes</button>
    </div>

    <div class="status" id="status">
      <div class="reel"><span></span><span></span><span></span></div>
      <span id="status-text">Fetching transcript…</span>
    </div>

    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="result-meta">
        <span class="label" id="result-style"></span>
        <span class="cached-tag" id="cached-tag" style="display:none;">From cache</span>
      </div>
      <div class="summary" id="summary-text"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000';

    const urlInput = document.getElementById('url-input');
    const submitBtn = document.getElementById('submit-btn');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');
    const summaryText = document.getElementById('summary-text');
    const resultStyle = document.getElementById('result-style');
    const cachedTag = document.getElementById('cached-tag');
    const styleBtns = document.querySelectorAll('.style-btn');

    let activeStyle = 'tldr_bullets';
    const styleLabels = {
      tldr_bullets: 'TL;DR + key points',
      chapters: 'Chapter breakdown',
      study_notes: 'Study notes',
    };

    styleBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        styleBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeStyle = btn.dataset.style;
      });
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      statusEl.classList.toggle('visible', isLoading);
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('visible');
    }

    function clearError() {
      errorEl.classList.remove('visible');
      errorEl.textContent = '';
    }

    async function summarize() {
      const url = urlInput.value.trim();
      if (!url) {
        showError('Paste a YouTube URL first.');
        return;
      }

      clearError();
      resultEl.classList.remove('visible');
      setLoading(true);
      statusText.textContent = 'Fetching transcript and summarizing…';

      try {
        const res = await fetch(`${API_BASE}/api/summarize`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, style: activeStyle }),
        });

        // Parse the body as JSON if possible; fall back gracefully if the
        // server ever returns something non-JSON, so failures are always
        // shown as a real message instead of a generic connection error.
        let data;
        try {
          data = await res.json();
        } catch {
          data = null;
        }

        if (!res.ok) {
          showError(
            (data && data.detail) ||
            `Server error (${res.status}). Check the backend terminal for details.`
          );
          return;
        }

        if (!data) {
          showError('Got an unexpected response from the backend.');
          return;
        }

        resultStyle.textContent = styleLabels[data.style] || data.style;
        cachedTag.style.display = data.cached ? 'inline-block' : 'none';
        summaryText.textContent = data.summary;
        resultEl.classList.add('visible');

      } catch (err) {
        console.error('Fetch error:', err);
        showError(
          'Could not connect to the backend. Check that FastAPI is running on localhost:8000.'
        );
      } finally {
        setLoading(false);
      }
    }

    submitBtn.addEventListener('click', summarize);
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') summarize();
    });
  </script>
</body>
</html>
